name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Deployment Zip Package
        run: |
          git archive --format=zip HEAD -o deploy-package.zip

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: green-forensics
          environment_name: green-forensics-env
          region: ap-southeast-1
          version_label: "build-${{ github.run_number }}-${{ github.sha }}"
          deployment_package: deploy-package.zip
